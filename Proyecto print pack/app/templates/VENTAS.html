<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Sistema ERP</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .producto-card { cursor: pointer; transition: transform 0.2s; }
        .producto-card:hover { transform: scale(1.02); border-color: #0d6efd; }
        .carrito-container { height: 55vh; overflow-y: auto; }
        .catalogo-container { height: 75vh; overflow-y: auto; }
        /* Quita las flechas por defecto de los inputs numéricos para estética POS */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-cart-check"></i> Módulo de Ventas (Asesores)</span>
        <a href="/" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row">
        <!-- DETALLE DE FACTURACIÓN -->
        <div class="col-lg-5 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Detalle de Factura</h5>
                </div>
                <div class="card-body d-flex flex-column">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cliente</label>
                        <div class="input-group">
                            <select id="selectCliente" class="form-select">
                                <option value="">Seleccione un cliente...</option>
                            </select>
                            <button class="btn btn-outline-secondary" type="button" onclick="mostrarModalCliente()">
                                <i class="bi bi-person-plus"></i> Nuevo
                            </button>
                        </div>
                    </div>

                    <div class="carrito-container border rounded p-2 mb-3 flex-grow-1">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th>Cant.</th>
                                    <th>Precio</th>
                                    <th class="text-end">Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tablaCarrito">
                                <!-- Render dinámico mediante controlador JS -->
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-auto border-top pt-3">
                        <div class="mb-2">
                            <label class="form-label text-muted small">Notas de la venta (Opcional)</label>
                            <input type="text" id="notasVenta" class="form-control form-control-sm" placeholder="Ej: Despacho inmediato...">
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0">TOTAL:</h4>
                            <h3 class="mb-0 text-success" id="totalVenta">$0</h3>
                        </div>
                        <button id="btnProcesarVenta" class="btn btn-success w-100 btn-lg" onclick="procesarVenta()">
                            <i class="bi bi-check-circle"></i> Procesar Venta
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CATÁLOGO DE PRODUCTOS -->
        <div class="col-lg-7 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Catálogo de Productos</h5>
                    <input type="text" id="buscarProducto" class="form-control form-control-sm w-50" placeholder="Buscar por nombre o código..." onkeyup="filtrarProductos()">
                </div>
                <div class="card-body catalogo-container bg-light">
                    <div class="row g-3" id="listaProductos">
                        <!-- Render dinámico mediante controlador JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL REGISTRO DE CLIENTES -->
<div class="modal fade" id="modalNuevoCliente" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Registrar Nuevo Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formCliente">
            <div class="mb-2">
                <label class="small fw-bold">Nombre Completo *</label>
                <input type="text" id="cliNombre" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="small fw-bold">Empresa (Opcional)</label>
                <input type="text" id="cliEmpresa" class="form-control">
            </div>
            <div class="mb-2">
                <label class="small fw-bold">Teléfono de contacto *</label>
                <input type="text" id="cliTelefono" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="small fw-bold">Correo electrónico</label>
                <input type="email" id="cliEmail" class="form-control">
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarCliente()">Guardar Cliente</button>
      </div>
    </div>
  </div>
</div>

<!-- Dependencias -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ENLACE AL CONTROLADOR JS SEPARADO (ESTRUCTURA MVC DE FLASK) -->
<script src="{{ url_for('static', filename='js/ventas.js') }}"></script>
</body>
</html>
