<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintPack - Módulo</title>
    <!-- Tus fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap para las tablas (déjalo arriba) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- TU ESTILO CORPORATIVO (Abajo para que mande sobre Bootstrap) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>

    <!-- TU HEADER EXACTO DE PRINTPACK -->
    <header>
        <div class="logo">
            <a href="{{ url_for('main.inicio') }}">
                <img src="https://printpackcaribe.com/wp-content/uploads/2025/08/ECOBOLSAS-CARIBE-PRINTPACK-LOGOS-4-scaled-324x141.png" alt="PrintPack Caribe">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('main.inicio') }}">Inicio</a></li>
                <li><a href="{{ url_for('main.procesos') }}">Procesos</a></li>
                <li><a href="{{ url_for('main.productos') }}">Productos</a></li>
                <li><a href="{{ url_for('main.contacto') }}">Contáctanos</a></li>
                <!-- Este es el botón que lo llevará al Dashboard -->
                <li><a href="#" class="active">Panel ERP</a></li> 
            </ul>
        </nav>
        <a href="{{ url_for('main.logout') }}" id="auth-button" class="btn-nav">Cerrar Sesión</a>
    </header>

    <main class="py-5">
        <!-- AQUÍ DEBES DEJAR EL <div class="container"> QUE YA TIENEN TUS VISTAS CON LAS TABLAS -->

<div class="container-fluid px-4">
    <div class="row">
        <!-- DETALLE DE FACTURACIÓN -->
        <div class="col-lg-5 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Detalle de Factura</h5>
                </div>
                <div class="card-body d-flex flex-column">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cliente</label>
                        <div class="input-group">
                            <select id="selectCliente" class="form-select">
                                <option value="">Seleccione un cliente...</option>
                            </select>
                            <button class="btn btn-outline-secondary" type="button" onclick="mostrarModalCliente()">
                                <i class="bi bi-person-plus"></i> Nuevo
                            </button>
                        </div>
                    </div>

                    <div class="carrito-container border rounded p-2 mb-3 flex-grow-1">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th>Cant.</th>
                                    <th>Precio</th>
                                    <th class="text-end">Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tablaCarrito">
                                <!-- Render dinámico mediante controlador JS -->
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-auto border-top pt-3">
                        <div class="mb-2">
                            <label class="form-label text-muted small">Notas de la venta (Opcional)</label>
                            <input type="text" id="notasVenta" class="form-control form-control-sm" placeholder="Ej: Despacho inmediato...">
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0">TOTAL:</h4>
                            <h3 class="mb-0 text-success" id="totalVenta">$0</h3>
                        </div>
                        <button id="btnProcesarVenta" class="btn btn-success w-100 btn-lg" onclick="procesarVenta()">
                            <i class="bi bi-check-circle"></i> Procesar Venta
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CATÁLOGO DE PRODUCTOS -->
        <div class="col-lg-7 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Catálogo de Productos</h5>
                    <input type="text" id="buscarProducto" class="form-control form-control-sm w-50" placeholder="Buscar por nombre o código..." onkeyup="filtrarProductos()">
                </div>
                <div class="card-body catalogo-container bg-light">
                    <div class="row g-3" id="listaProductos">
                        <!-- Render dinámico mediante controlador JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL REGISTRO DE CLIENTES -->
<div class="modal fade" id="modalNuevoCliente" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Registrar Nuevo Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formCliente">
            <div class="mb-2">
                <label class="small fw-bold">Nombre Completo *</label>
                <input type="text" id="cliNombre" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="small fw-bold">Empresa (Opcional)</label>
                <input type="text" id="cliEmpresa" class="form-control">
            </div>
            <div class="mb-2">
                <label class="small fw-bold">Teléfono de contacto *</label>
                <input type="text" id="cliTelefono" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="small fw-bold">Correo electrónico</label>
                <input type="email" id="cliEmail" class="form-control">
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarCliente()">Guardar Cliente</button>
      </div>
    </div>
  </div>
</div>

<!-- Dependencias -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ENLACE AL CONTROLADOR JS SEPARADO (ESTRUCTURA MVC DE FLASK) -->
<script src="{{ url_for('static', filename='js/ventas.js') }}"></script>

        </main>

    <footer>
        <p class="copyright" style="border:none; margin:0; padding:0;">
            Copyright © 2025 PrintPack Caribe - Panel Administrativo
        </p>
    </footer>
</body>
</html>
