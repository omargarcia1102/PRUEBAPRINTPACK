<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintPack - Módulo</title>
    <!-- Tus fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap para las tablas (déjalo arriba) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- TU ESTILO CORPORATIVO (Abajo para que mande sobre Bootstrap) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>

    <!-- TU HEADER EXACTO DE PRINTPACK -->
    <header>
        <div class="logo">
            <a href="{{ url_for('main.inicio') }}">
                <img src="https://printpackcaribe.com/wp-content/uploads/2025/08/ECOBOLSAS-CARIBE-PRINTPACK-LOGOS-4-scaled-324x141.png" alt="PrintPack Caribe">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('main.inicio') }}">Inicio</a></li>
                <li><a href="{{ url_for('main.procesos') }}">Procesos</a></li>
                <li><a href="{{ url_for('main.productos') }}">Productos</a></li>
                <li><a href="{{ url_for('main.contacto') }}">Contáctanos</a></li>
                <!-- Este es el botón que lo llevará al Dashboard -->
                <li><a href="#" class="active">Panel ERP</a></li> 
            </ul>
        </nav>
        <a href="{{ url_for('main.logout') }}" id="auth-button" class="btn-nav">Cerrar Sesión</a>
    </header>

    <main class="py-5">
        <!-- AQUÍ DEBES DEJAR EL <div class="container"> QUE YA TIENEN TUS VISTAS CON LAS TABLAS -->

<div class="container">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Usuarios del Sistema</h5>
            <button class="btn btn-danger btn-sm fw-bold" onclick="abrirModalUsuario()">
                <i class="bi bi-person-plus"></i> Crear Usuario
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <!-- El JS llenará esto -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: CREAR / EDITAR USUARIO -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="tituloModalUser">Nuevo Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formUsuario">
            <div class="mb-3">
                <label class="form-label fw-bold small">Nombre de Usuario</label>
                <input type="text" id="userNombre" class="form-control" required placeholder="Ej: j.perez" autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Contraseña</label>
                <input type="password" id="userPassword" class="form-control" placeholder="Escribe para cambiar/asignar clave">
                <small class="text-muted" id="notaPassword">Si estás editando, déjalo vacío para mantener la clave actual.</small>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold small">Rol</label>
                    <select id="userRol" class="form-select">
                        <option value="asesor">Asesor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold small">Estado</label>
                    <select id="userEstado" class="form-select">
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo (Suspendido)</option>
                    </select>
                </div>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnGuardarUser" onclick="guardarUsuario()">
            <i class="bi bi-save"></i> Guardar Usuario
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>

        </main>

    <footer>
        <p class="copyright" style="border:none; margin:0; padding:0;">
            Copyright © 2025 PrintPack Caribe - Panel Administrativo
        </p>
    </footer>
</body>
</html>
