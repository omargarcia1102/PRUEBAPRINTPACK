<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger mb-4 shadow">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock"></i> Panel de Administrador - Usuarios</span>
        <a href="/" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Usuarios del Sistema</h5>
            <button class="btn btn-danger btn-sm fw-bold" onclick="abrirModalUsuario()">
                <i class="bi bi-person-plus"></i> Crear Usuario
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <!-- El JS llenará esto -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: CREAR / EDITAR USUARIO -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="tituloModalUser">Nuevo Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formUsuario">
            <div class="mb-3">
                <label class="form-label fw-bold small">Nombre de Usuario</label>
                <input type="text" id="userNombre" class="form-control" required placeholder="Ej: j.perez" autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Contraseña</label>
                <input type="password" id="userPassword" class="form-control" placeholder="Escribe para cambiar/asignar clave">
                <small class="text-muted" id="notaPassword">Si estás editando, déjalo vacío para mantener la clave actual.</small>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold small">Rol</label>
                    <select id="userRol" class="form-select">
                        <option value="asesor">Asesor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold small">Estado</label>
                    <select id="userEstado" class="form-select">
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo (Suspendido)</option>
                    </select>
                </div>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnGuardarUser" onclick="guardarUsuario()">
            <i class="bi bi-save"></i> Guardar Usuario
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>
</body>
</html>
