<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - Sistema ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-receipt"></i> Historial de Facturas</span>
        <a href="/" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Ventas Registradas</h5>
            <input type="text" id="buscarFactura" class="form-control form-control-sm w-25" placeholder="Buscar por cliente o factura..." onkeyup="filtrarVentas()">
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>N° Factura</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Notas</th>
                            <th class="text-end">Total</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVentas">
                        <!-- Renderizado dinámico vía JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: DETALLE DE FACTURA -->
<div class="modal fade" id="modalDetalleVenta" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="tituloModalFactura">Detalle de Factura</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-3">
            <div class="col-sm-6">
                <strong>Cliente:</strong> <span id="detalleCliente"></span><br>
                <strong>Fecha:</strong> <span id="detalleFecha"></span>
            </div>
            <div class="col-sm-6 text-end">
                <strong>Total Pagado:</strong> <h4 class="text-success mb-0" id="detalleTotal"></h4>
            </div>
        </div>
        <table class="table table-sm table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th class="text-center">Cant.</th>
                    <th class="text-end">Precio Unit.</th>
                    <th class="text-end">Subtotal</th>
                </tr>
            </thead>
            <tbody id="tablaDetalleItems">
                <!-- Renderizado dinámico vía JS -->
            </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" onclick="window.print()">
            <i class="bi bi-printer"></i> Imprimir
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- ARCHIVO JS SEPARADO -->
<script src="{{ url_for('static', filename='js/historial_ventas.js') }}"></script>
</body>
</html>
